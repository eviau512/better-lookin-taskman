name: Build Windows x64

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Taskmgr.exe
        shell: cmd
        run: call build.bat

      - name: Upload Taskmgr executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterLookinWin10Taskman-x64
          path: Taskmgr.exe
          if-no-files-found: error
